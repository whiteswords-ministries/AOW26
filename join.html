.sub{margin:14px auto 0;max-width:460px;opacity:.92}
.line{width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:22px auto}
.card{background:#fff;border-radius:18px;padding:6px;box-shadow:0 22px 50px rgba(0,0,0,.4);border-top:5px solid var(--gold)}
iframe{display:block;width:100%;height:min(820px,150vh);border:0;border-radius:12px;background:#fff}
.alt{margin-top:16px;font-size:.92rem;opacity:.9}
.alt a{color:var(--gold);font-weight:700}
.wa{display:inline-flex;align-items:center;gap:10px;margin-top:26px;background:#25d366;color:#04230f;text-decoration:none;font-weight:800;font-size:1.1rem;padding:15px 30px;border-radius:999px;box-shadow:0 10px 26px rgba(37,211,102,.45),0 0 0 3px rgba(255,255,255,.25);transition:transform .2s,background .2s}
.wa:hover{background:#3df07d;transform:translateY(-2px) scale(1.03)}
.wa svg{width:26px;height:26px;flex:none}
a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wm{margin-top:28px;font-style:italic;color:var(--gold);font-size:.95rem}
@media (prefers-reduced-motion:no-preference){
.wa{animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 10px 26px rgba(37,211,102,.45),0 0 0 0 rgba(37,211,102,.6)}70%,100%{box-shadow:0 10px 26px rgba(37,211,102,.45),0 0 0 18px rgba(37,211,102,0)}}
.wrap>*{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}
.wrap>*:nth-child(2){animation-delay:.12s}.wrap>*:nth-child(3){animation-delay:.24s}.wrap>*:nth-child(4){animation-delay:.36s}.wrap>*:nth-child(5){animation-delay:.5s}.wrap>*:nth-child(6){animation-delay:.6s}.wrap>*:nth-child(7){animation-delay:.7s}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.logo{animation:up .8s forwards,bob 5s ease-in-out 1s infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
}
</style>
